<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Kas & Iuran RT</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --sidebar-width: 260px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

    /* NAVBAR ATAS (HEADER MOBILE) */
    .top-navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 90;
    }
    .hamburger-btn {
      background: transparent;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 6px;
    }
    .hamburger-btn:hover { background: #f1f5f9; }
    .nav-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); }

    /* SIDEBAR NAVIGASI */
    .sidebar {
      position: fixed;
      top: 0;
      left: calc(-1 * var(--sidebar-width));
      width: var(--sidebar-width);
      height: 100%;
      background: var(--card-bg);
      box-shadow: 4px 0 20px rgba(0,0,0,0.1);
      transition: left 0.3s ease;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }
    .sidebar.open { left: 0; }

    .sidebar-header {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header h3 { font-size: 1.1rem; color: var(--primary); }
    .close-btn {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 6px;
    }
    .menu-item {
      padding: 12px 14px;
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: left;
      transition: all 0.2s;
    }
    .menu-item:hover { background: #f1f5f9; color: var(--text-main); }
    .menu-item.active { background: #eff6ff; color: var(--primary); }

    /* BACKDROP / OVERLAY GELAP SAAT SIDEBAR BUKA */
    .sidebar-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(2px);
      display: none;
      z-index: 95;
    }
    .sidebar-overlay.active { display: block; }

    /* MAIN CONTAINER */
    .container { 
      max-width: 650px; 
      margin: 20px auto; 
      background: var(--card-bg); 
      padding: 20px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); 
    }

    /* STATUS KONEKSI BADGE */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .status-online { background: #dcfce7; color: var(--success); }
    .status-offline { background: #fef3c7; color: var(--warning); }

    /* TAB CONTENT */
    .tab-content { display: none; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* FORM STYLING */
    .form-group { 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
      margin-bottom: 14px; 
      width: 100%; 
    }
    
    label { font-size: 0.8rem; font-weight: 600; color: var(--text-main); text-transform: uppercase; }
    
    input, select { 
      width: 100%; 
      max-width: 100%;
      box-sizing: border-box;
      padding: 10px 12px; 
      border: 1px solid var(--border-color); 
      border-radius: 8px; 
      font-size: 0.9rem; 
      background-color: #fafafa;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="date"], input[type="month"], select {
      min-height: 42px;
      background-color: #ffffff;
    }

    input[type="file"] {
      background-color: #ffffff;
      padding: 8px;
      cursor: pointer;
    }

    input:focus, select:focus { outline: none; border-color: var(--primary); background-color: #fff; }
    
    .form-group-row { 
      display: flex; 
      gap: 10px; 
      width: 100%;
    }
    
    .form-group-row > div { 
      flex: 1; 
      min-width: 0;
    }
    
    button.btn-submit { 
      width: 100%;
      padding: 13px;
      background-color: var(--primary); 
      color: white; 
      border: none; 
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600; 
      cursor: pointer; 
      margin-top: 8px; 
    }

    /* TOMBOL HAPUS AKSI */
    .btn-delete {
      background-color: #fee2e2;
      color: var(--danger);
      border: 1px solid #fca5a5;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-delete:hover {
      background-color: var(--danger);
      color: white;
    }

    /* LAPORAN & RINGKASAN */
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .summary-card { background: #f8fafc; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); text-align: center; }
    .summary-card label { font-size: 0.7rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
    .summary-card .amount { font-weight: 700; font-size: 0.95rem; }
    
    .table-container { overflow-x: auto; margin-top: 10px; border: 1px solid var(--border-color); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 500px; }
    th { background-color: #f1f5f9; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border-color); }
    
    .badge { padding: 4px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .badge-lunas { background-color: #dcfce7; color: var(--success); }
    .badge-belum { background-color: #fee2e2; color: var(--danger); }

    /* LOADING OVERLAY - DIPERBAIKI (align-items: center) */
    #loadingOverlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(4px);
      display: none; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; color: white; font-weight: 600;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3); border-top-color: #ffffff;
      border-radius: 50%; animation: rotation 0.8s linear infinite; margin-bottom: 12px;
    }
    @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      body { padding: 0; }
      .container { margin: 10px; border-radius: 12px; padding: 16px; }
      .summary-grid { grid-template-columns: 1fr; }
      .summary-card { text-align: left; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>

<!-- COMPONENT LOADING OVERLAY -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">Memproses data...</div>
</div>

<!-- NAVBAR TOP FIX -->
<div class="top-navbar">
  <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
  <div class="nav-title" id="judulHalaman">Iuran Warga</div>
  <div style="width: 24px;"></div>
</div>

<!-- SIDEBAR OVERLAY -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR MENU DRAWER -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>Kas & Iuran RT</h3>
    <button class="close-btn" onclick="closeSidebar()">✕</button>
  </div>
  <div class="sidebar-menu">
    <button class="menu-item active" onclick="pilihMenu(event, 'tabIuran', 'Iuran Warga')">💳 Input Iuran Warga</button>
    <button class="menu-item" onclick="pilihMenu(event, 'tabKas', 'Kas Masuk Lain')">📥 Input Kas Lain</button>
    <button class="menu-item" onclick="pilihMenu(event, 'tabPengeluaran', 'Pengeluaran Kas')">📤 Input Pengeluaran</button>
    <button class="menu-item" onclick="pilihMenu(event, 'tabCekWarga', 'Status Iuran Warga')">🔍 Cek Status Warga</button>
    <button class="menu-item" onclick="pilihMenu(event, 'tabLaporan', 'Laporan Bulanan RT')">📊 Laporan Bulanan RT</button>
  </div>
</div>

<!-- MAIN CONTENT CONTAINER -->
<div class="container">
  <!-- INDIKATOR STATUS KONEKSI & SINKRONISASI -->
  <div id="statusBar" class="status-bar status-online">
    <span id="koneksiTeks">Status: Online</span>
    <span id="antreanTeks">Antrean Offline: 0</span>
  </div>

  <!-- MENU 1: INPUT IURAN WARGA -->
  <div id="tabIuran" class="tab-content active">
    <form id="formIuran">
      <div class="form-group">
        <label>Tanggal Transaksi</label>
        <input type="date" id="tglIuran" required>
      </div>
      <div class="form-group-row">
        <div class="form-group">
          <label>Blok</label>
          <input type="text" id="blok" placeholder="F1" required oninput="perbaruiDropdownBulanFilter()">
        </div>
        <div class="form-group">
          <label>No. Rumah</label>
          <input type="number" id="noRumah" placeholder="1" required oninput="perbaruiDropdownBulanFilter()">
        </div>
      </div>

      <div class="form-group-row">
        <div class="form-group">
          <label>Pilih Bulan</label>
          <select id="blnIuran" required>
            <option value="">-- Isikan Blok & No Rumah Dahulu --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Pilih Tahun</label>
          <input type="number" id="thnIuran" placeholder="2026" required onchange="perbaruiDropdownBulanFilter()" oninput="perbaruiDropdownBulanFilter()">
        </div>
      </div>

      <div class="form-group">
        <label>Jumlah Nominal (Rp)</label>
        <input type="number" id="jmlIuran" value="50000" placeholder="50000" required>
      </div>
      <div class="form-group">
        <label>Upload Bukti Transfer / Resi (Opsional)</label>
        <input type="file" id="buktiIuran" accept="image/*,.pdf">
      </div>
      <button type="submit" class="btn-submit">Simpan Iuran</button>
    </form>
  </div>

  <!-- MENU 2: KAS LAIN -->
  <div id="tabKas" class="tab-content">
    <form id="formKas">
      <div class="form-group">
        <label>Tanggal Transaksi</label>
        <input type="date" id="tglKas" required>
      </div>
      <div class="form-group">
        <label>Keterangan Pemasukan</label>
        <input type="text" id="ketKas" placeholder="Sponsor Event / Donasi" required>
      </div>
      <div class="form-group">
        <label>Jumlah Nominal (Rp)</label>
        <input type="number" id="jmlKas" placeholder="100000" required>
      </div>
      <button type="submit" class="btn-submit">Simpan Kas Masuk</button>
    </form>
  </div>

  <!-- MENU 3: PENGELUARAN -->
  <div id="tabPengeluaran" class="tab-content">
    <form id="formPengeluaran">
      <div class="form-group">
        <label>Tanggal Transaksi</label>
        <input type="date" id="tglPengeluaran" required>
      </div>
      <div class="form-group">
        <label>Keterangan Pengeluaran</label>
        <input type="text" id="ketPengeluaran" placeholder="Perbaikan Lampu Jalan" required>
      </div>
      <div class="form-group">
        <label>Jumlah Nominal (Rp)</label>
        <input type="number" id="jmlPengeluaran" placeholder="75000" required>
      </div>
      <button type="submit" class="btn-submit" style="background-color: var(--danger);">Simpan Pengeluaran</button>
    </form>
  </div>

  <!-- MENU 4: CEK WARGA -->
  <div id="tabCekWarga" class="tab-content">
    <div class="form-group-row">
      <div class="form-group"><label>Blok</label><input type="text" id="cekBlok" placeholder="F1"></div>
      <div class="form-group"><label>No. Rumah</label><input type="number" id="cekNoRumah" placeholder="1"></div>
    </div>
    <div class="form-group"><label>Tahun</label><input type="number" id="cekTahun" style="margin-bottom: 0;"></div>
    <button onclick="cekIuranWarga()" class="btn-submit" style="background-color: #0284c7; margin-top: 14px;">Cek Status Pembayaran</button>

    <div class="table-container" style="margin-top: 16px;">
      <table id="tabelStatusWarga" style="display:none;">
        <thead>
          <tr>
            <th>Bulan</th>
            <th>Status</th>
            <th>Tgl Bayar</th>
            <th>Bukti</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- MENU 5: LAPORAN -->
  <div id="tabLaporan" class="tab-content">
    <div class="form-group-row">
      <div class="form-group">
        <label>Pilih Bulan</label>
        <input type="month" id="filterBulan" onchange="muatLaporanKeuangan()">
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <select id="filterKategori" onchange="muatLaporanKeuangan()">
          <option value="semua">Semua Transaksi</option>
          <option value="Kas">Kas Masuk</option>
          <option value="Iuran">Iuran Warga</option>
          <option value="Keluar">Pengeluaran</option>
        </select>
      </div>
    </div>

    <div class="summary-grid">
      <div class="summary-card"><label>Pemasukan</label><div class="amount" style="color:var(--success);" id="totMasuk">Rp 0</div></div>
      <div class="summary-card"><label>Pengeluaran</label><div class="amount" style="color:var(--danger);" id="totKeluar">Rp 0</div></div>
      <div class="summary-card"><label>Saldo Akhir</label><div class="amount" style="color:var(--primary);" id="saldo">Rp 0</div></div>
    </div>
    <div class="table-container">
      <table id="tabelLaporan">
        <thead><tr><th>Tgl</th><th>Kategori</th><th>Rincian</th><th>Jumlah</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoNNBnyomIo7IhjVUpefIUkhBpqpWeJxIR6O7AbBxtemH1iOCZ8lHOLOg9Nbj0t2nK/exec";
  const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  
  let cacheDataServer = null;

  function dapatkanTanggalHariIni() {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  function dapatkanBulanHariIni() {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    return `${yyyy}-${mm}`;
  }

  function setTanggalDefaultForm() {
    const hariIni = dapatkanTanggalHariIni();
    const bulanIni = dapatkanBulanHariIni();
    const tahunIni = new Date().getFullYear();
    
    document.getElementById("tglIuran").value = hariIni;
    document.getElementById("tglKas").value = hariIni;
    document.getElementById("tglPengeluaran").value = hariIni;
    
    document.getElementById("thnIuran").value = tahunIni;
    document.getElementById("cekTahun").value = tahunIni;
    document.getElementById("filterBulan").value = bulanIni;
    
    muatDataServer();
  }

  function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("sidebarOverlay").classList.toggle("active");
  }

  function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("active");
  }

  function pilihMenu(evt, tabName, judul) {
    const tabContents = document.getElementsByClassName("tab-content");
    for (let i = 0; i < tabContents.length; i++) tabContents[i].classList.remove("active");
    
    const menuItems = document.getElementsByClassName("menu-item");
    for (let i = 0; i < menuItems.length; i++) menuItems[i].classList.remove("active");

    document.getElementById(tabName).classList.add("active");
    evt.currentTarget.classList.add("active");
    document.getElementById("judulHalaman").innerText = judul;

    if (tabName === 'tabLaporan') {
      muatLaporanKeuangan();
    }
    
    closeSidebar();
  }

  function tampilkanLoading(pesan = "Memproses data...") {
    document.getElementById("loadingText").innerText = pesan;
    document.getElementById("loadingOverlay").style.display = "flex";
  }

  function sembunyikanLoading() {
    document.getElementById("loadingOverlay").style.display = "none";
  }

  function formatTanggalIndo(dateString) {
    if (!dateString) return "-";
    const d = new Date(dateString);
    if (isNaN(d.getTime())) return dateString;
    return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
  }

  function formatIuranBulan(bulanString) {
    if (!bulanString) return "-";
    const parts = bulanString.split("-");
    if (parts.length >= 2) {
      const indexBulan = parseInt(parts[1], 10) - 1;
      if (indexBulan >= 0 && indexBulan < 12) return `${namaBulan[indexBulan]} ${parts[0]}`;
    }
    return bulanString;
  }

  async function muatDataServer() {
    if (!navigator.onLine) return;
    try {
      const res = await fetch(SCRIPT_URL);
      cacheDataServer = await res.json();
      perbaruiDropdownBulanFilter();
    } catch (e) {
      console.error("Gagal memperbarui cache data server", e);
    }
  }

  function perbaruiDropdownBulanFilter() {
    const blok = document.getElementById("blok").value.trim().toUpperCase();
    const noRumah = document.getElementById("noRumah").value.trim();
    const tahunPilihan = document.getElementById("thnIuran").value.trim();
    const selectBulan = document.getElementById("blnIuran");

    selectBulan.innerHTML = "";

    if (!blok || !noRumah || !tahunPilihan) {
      selectBulan.innerHTML = `<option value="">-- Isikan Blok, No Rumah & Tahun --</option>`;
      return;
    }

    let bulanTerbayarSet = new Set();

    if (cacheDataServer && cacheDataServer.iuran) {
      cacheDataServer.iuran.forEach(row => {
        if (String(row[1]).toUpperCase() === blok && String(row[2]) === noRumah) {
          let rawBulan = String(row[3]);
          if (rawBulan.includes("T")) {
            const d = new Date(rawBulan);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            rawBulan = `${y}-${m}`;
          } else {
            rawBulan = rawBulan.substring(0, 7);
          }
          bulanTerbayarSet.add(rawBulan);
        }
      });
    }

    let opsiDibuat = 0;
    const bulanSekarangIndex = new Date().getMonth() + 1;

    for (let m = 1; m <= 12; m++) {
      const duaDigitM = String(m).padStart(2, '0');
      const kodeBulan = `${tahunPilihan}-${duaDigitM}`;
      
      if (!bulanTerbayarSet.has(kodeBulan)) {
        const opt = document.createElement("option");
        opt.value = duaDigitM;
        opt.innerText = namaBulan[m - 1];
        
        if (m === bulanSekarangIndex) opt.selected = true;
        
        selectBulan.appendChild(opt);
        opsiDibuat++;
      }
    }

    if (opsiDibuat === 0) {
      selectBulan.innerHTML = `<option value="">-- Semua Bulan di Tahun ${tahunPilihan} Sudah Lunas --</option>`;
    }
  }

  function updateStatusKoneksi() {
    const bar = document.getElementById("statusBar");
    const teks = document.getElementById("koneksiTeks");
    const antrean = ambilAntreanOffline();
    
    document.getElementById("antreanTeks").innerText = `Antrean Offline: ${antrean.length}`;

    if (navigator.onLine) {
      bar.className = "status-bar status-online";
      teks.innerText = "Status: Online";
      if (antrean.length > 0) sinkronkanDataOffline();
    } else {
      bar.className = "status-bar status-offline";
      teks.innerText = "Status: Offline";
    }
  }

  window.addEventListener('online', updateStatusKoneksi);
  window.addEventListener('offline', updateStatusKoneksi);

  function ambilAntreanOffline() {
    return JSON.parse(localStorage.getItem("antreanKasRT") || "[]");
  }

  function simpanKeAntreanOffline(payload) {
    const antrean = ambilAntreanOffline();
    antrean.push(payload);
    localStorage.setItem("antreanKasRT", JSON.stringify(antrean));
    updateStatusKoneksi();
  }

  // FUNGSI KIRIM DATA OPTIMAL (TANPA DELAY SETTIMEOUT & RE-FETCH INSTAN)
  function kirimData(payload) {
    if (!navigator.onLine) {
      simpanKeAntreanOffline(payload);
      alert("Koneksi offline: Data disimpan sementara di HP.");
      setTanggalDefaultForm();
      return;
    }

    tampilkanLoading("Menyimpan...");
    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      sembunyikanLoading();
      alert("Data berhasil diproses!");

      // Update cache lokal langsung tanpa perlu fetch ulang seluruh data dari server
      if (payload.action === "inputIuran" && cacheDataServer && cacheDataServer.iuran) {
        cacheDataServer.iuran.push([
          payload.tanggal,
          payload.blok,
          payload.noRumah,
          payload.bulan,
          payload.jumlah,
          "-"
        ]);
      } else if (payload.action === "inputKas" && cacheDataServer && cacheDataServer.kas) {
        cacheDataServer.kas.push([payload.tanggal, payload.keterangan, payload.jumlah]);
      } else if (payload.action === "inputPengeluaran" && cacheDataServer && cacheDataServer.pengeluaran) {
        cacheDataServer.pengeluaran.push([payload.tanggal, payload.keterangan, payload.jumlah]);
      }

      setTanggalDefaultForm();
    })
    .catch(err => {
      sembunyikanLoading();
      simpanKeAntreanOffline(payload);
      alert("Gagal terhubung ke server. Data disimpan di antrean offline.");
      setTanggalDefaultForm();
    });
  }

  async function sinkronkanDataOffline() {
    const antrean = ambilAntreanOffline();
    if (antrean.length === 0) return;

    tampilkanLoading(`Menyinkronkan ${antrean.length} data offline...`);

    for (let i = 0; i < antrean.length; i++) {
      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(antrean[i])
        });
      } catch (e) {
        console.error("Gagal sinkron:", e);
      }
    }

    localStorage.removeItem("antreanKasRT");
    sembunyikanLoading();
    updateStatusKoneksi();
    alert("Semua data offline berhasil tersinkron ke Google Sheets!");
    muatDataServer();
  }

  function konversiFileKeBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve({
        namaFile: file.name,
        tipeFile: file.type,
        base64: reader.result.split(',')[1]
      });
      reader.onerror = error => reject(error);
      reader.readAsDataURL(file);
    });
  }

  document.getElementById("formKas").onsubmit = (e) => {
    e.preventDefault();
    kirimData({
      action: "inputKas",
      tanggal: document.getElementById("tglKas").value,
      keterangan: document.getElementById("ketKas").value,
      jumlah: Number(document.getElementById("jmlKas").value)
    });
    e.target.reset();
  };

  document.getElementById("formIuran").onsubmit = async (e) => {
    e.preventDefault();
    
    const blok = document.getElementById("blok").value.trim().toUpperCase();
    const noRumah = document.getElementById("noRumah").value.trim();
    const bulanDuaDigit = document.getElementById("blnIuran").value;
    const tahunInput = document.getElementById("thnIuran").value.trim();

    if (!bulanDuaDigit || !tahunInput) {
      alert("Pilih bulan dan tahun iuran yang valid.");
      return;
    }

    const kodeBulanLengkap = `${tahunInput}-${bulanDuaDigit}`;

    if (cacheDataServer && cacheDataServer.iuran) {
      const sudahLunas = cacheDataServer.iuran.some(row => {
        const isSamaRumah = String(row[1]).toUpperCase() === blok && String(row[2]) === noRumah;
        let rawBulan = String(row[3]);
        if (rawBulan.includes("T")) {
          const d = new Date(rawBulan);
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          rawBulan = `${y}-${m}`;
        } else {
          rawBulan = rawBulan.substring(0, 7);
        }
        return isSamaRumah && rawBulan === kodeBulanLengkap;
      });

      if (sudahLunas) {
        alert(`Gagal Menyimpan: Blok ${blok} No ${noRumah} sudah LUNAS untuk iuran ${formatIuranBulan(kodeBulanLengkap)}.`);
        return;
      }
    }

    const fileInput = document.getElementById("buktiIuran");
    let fileData = null;

    if (fileInput.files.length > 0) {
      try {
        fileData = await konversiFileKeBase64(fileInput.files[0]);
      } catch (err) {
        alert("Gagal membaca file bukti transfer.");
        return;
      }
    }

    kirimData({
      action: "inputIuran",
      tanggal: document.getElementById("tglIuran").value,
      blok: blok,
      noRumah: noRumah,
      bulan: kodeBulanLengkap,
      jumlah: Number(document.getElementById("jmlIuran").value),
      bukti: fileData
    });

    e.target.reset();
    document.getElementById("jmlIuran").value = "50000";
  };

  document.getElementById("formPengeluaran").onsubmit = (e) => {
    e.preventDefault();
    kirimData({
      action: "inputPengeluaran",
      tanggal: document.getElementById("tglPengeluaran").value,
      keterangan: document.getElementById("ketPengeluaran").value,
      jumlah: Number(document.getElementById("jmlPengeluaran").value)
    });
    e.target.reset();
  };

  function cekIuranWarga() {
    const blok = document.getElementById("cekBlok").value.trim().toUpperCase();
    const noRumah = document.getElementById("cekNoRumah").value.trim();
    const tahun = document.getElementById("cekTahun").value.trim();

    if (!blok || !noRumah || !tahun) {
      alert("Lengkapi Blok, No. Rumah, dan Tahun.");
      return;
    }

    const tabel = document.getElementById("tabelStatusWarga");
    const tbody = tabel.querySelector("tbody");
    tbody.innerHTML = "";
    tabel.style.display = "table";

    // MENGGUNAKAN DATA CACHE LOKAL AGAR TAMPIL KETIKA DITEKAN TANPA WAIT DELAY
    const prosesRenderTabel = (data) => {
      const iuranRumah = data.iuran.filter(row => {
        return String(row[1]).toUpperCase() === blok && String(row[2]) === noRumah;
      });

      for (let i = 1; i <= 12; i++) {
        const bulanDuaDigit = String(i).padStart(2, '0');
        const kodeBulanCari = `${tahun}-${bulanDuaDigit}`;

        const transaksi = iuranRumah.find(row => {
          const rawBulan = String(row[3]);
          if (rawBulan.includes("T")) {
            const d = new Date(rawBulan);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            return `${y}-${m}` === kodeBulanCari;
          }
          return rawBulan.substring(0, 7) === kodeBulanCari;
        });

        if (transaksi) {
          const urlBukti = transaksi[5];
          let linkHtml = "-";

          if (urlBukti && urlBukti !== "-" && urlBukti.startsWith("http")) {
            linkHtml = `<a href="${urlBukti}" target="_blank" style="color: var(--primary); font-weight: 600; text-decoration: underline;">Lihat Bukti</a>`;
          }

          tbody.innerHTML += `
            <tr>
              <td>${namaBulan[i - 1]}</td>
              <td><span class="badge badge-lunas">LUNAS</span></td>
              <td>${formatTanggalIndo(transaksi[0])}</td>
              <td>${linkHtml}</td>
              <td>
                <button class="btn-delete" onclick="konfirmasiHapusIuran('${blok}', '${noRumah}', '${kodeBulanCari}', '${namaBulan[i - 1]} ${tahun}')">Hapus</button>
              </td>
            </tr>`;
        } else {
          tbody.innerHTML += `
            <tr>
              <td>${namaBulan[i - 1]}</td>
              <td><span class="badge badge-belum">BELUM</span></td>
              <td>-</td>
              <td>-</td>
              <td>-</td>
            </tr>`;
        }
      }
    };

    if (cacheDataServer) {
      prosesRenderTabel(cacheDataServer);
    } else {
      tampilkanLoading("Mengecek data warga...");
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          sembunyikanLoading();
          cacheDataServer = data;
          prosesRenderTabel(cacheDataServer);
        })
        .catch(err => {
          sembunyikanLoading();
          alert("Pencarian laporan membutuhkan koneksi internet.");
        });
    }
  }

  function konfirmasiHapusIuran(blok, noRumah, bulanKode, namaBulanTahun) {
    const setuju = confirm(`Apakah Anda yakin ingin MENGHAPUS data iuran Blok ${blok} No ${noRumah} untuk bulan ${namaBulanTahun}?`);
    
    if (setuju) {
      kirimDataHapus({
        action: "deleteIuran",
        blok: blok,
        noRumah: noRumah,
        bulan: bulanKode
      });
    }
  }

  // FUNGSI HAPUS DIPERCEPAT (TANPA DELAY SETTIMEOUT)
  function kirimDataHapus(payload) {
    tampilkanLoading("Menghapus...");
    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      sembunyikanLoading();
      alert("Data iuran berhasil dihapus!");

      // Langsung hapus dari cache lokal agar tampilan langsung hilang
      if (cacheDataServer && cacheDataServer.iuran) {
        cacheDataServer.iuran = cacheDataServer.iuran.filter(row => {
          const isMatch = String(row[1]).toUpperCase() === payload.blok && 
                          String(row[2]) === payload.noRumah && 
                          String(row[3]).substring(0, 7) === payload.bulan;
          return !isMatch;
        });
      }

      cekIuranWarga(); // Refresh tampilan tabel instan
    })
    .catch(err => {
      sembunyikanLoading();
      alert("Gagal terhubung ke server saat menghapus data.");
    });
  }

  function muatLaporanKeuangan() {
    const filterBulan = document.getElementById("filterBulan").value;
    const filterKategori = document.getElementById("filterKategori").value;
    if (!filterBulan) return;

    const renderLaporan = (data) => {
      let tbody = document.querySelector("#tabelLaporan tbody");
      tbody.innerHTML = "";
      let totalMasuk = 0, totalKeluar = 0;

      if (filterKategori === "semua" || filterKategori === "Kas") {
        data.kas.forEach(row => {
          if (String(row[0]).substring(0, 7) === filterBulan) {
            totalMasuk += Number(row[2]);
            tbody.innerHTML += `<tr><td>${formatTanggalIndo(row[0])}</td><td>Kas</td><td>${row[1]}</td><td>Rp ${Number(row[2]).toLocaleString()}</td></tr>`;
          }
        });
      }

      if (filterKategori === "semua" || filterKategori === "Iuran") {
        data.iuran.forEach(row => {
          if (String(row[0]).substring(0, 7) === filterBulan) {
            totalMasuk += Number(row[4]);
            const blnTeks = formatIuranBulan(String(row[3]));
            tbody.innerHTML += `<tr><td>${formatTanggalIndo(row[0])}</td><td>Iuran</td><td>Blok ${row[1]} No ${row[2]} (${blnTeks})</td><td>Rp ${Number(row[4]).toLocaleString()}</td></tr>`;
          }
        });
      }

      if (filterKategori === "semua" || filterKategori === "Keluar") {
        data.pengeluaran.forEach(row => {
          if (String(row[0]).substring(0, 7) === filterBulan) {
            totalKeluar += Number(row[2]);
            tbody.innerHTML += `<tr><td>${formatTanggalIndo(row[0])}</td><td>Keluar</td><td>${row[1]}</td><td style="color:var(--danger);">-Rp ${Number(row[2]).toLocaleString()}</td></tr>`;
          }
        });
      }

      if (filterKategori === "Kas" || filterKategori === "Iuran") {
        document.getElementById("totMasuk").innerText = `Rp ${totalMasuk.toLocaleString()}`;
        document.getElementById("totKeluar").innerText = `Rp 0`;
        document.getElementById("saldo").innerText = `Rp ${totalMasuk.toLocaleString()}`;
      } else if (filterKategori === "Keluar") {
        document.getElementById("totMasuk").innerText = `Rp 0`;
        document.getElementById("totKeluar").innerText = `Rp ${totalKeluar.toLocaleString()}`;
        document.getElementById("saldo").innerText = `-Rp ${totalKeluar.toLocaleString()}`;
      } else {
        document.getElementById("totMasuk").innerText = `Rp ${totalMasuk.toLocaleString()}`;
        document.getElementById("totKeluar").innerText = `Rp ${totalKeluar.toLocaleString()}`;
        document.getElementById("saldo").innerText = `Rp ${(totalMasuk - totalKeluar).toLocaleString()}`;
      }
    };

    if (cacheDataServer) {
      renderLaporan(cacheDataServer);
    } else {
      tampilkanLoading("Memuat laporan...");
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          sembunyikanLoading();
          cacheDataServer = data;
          renderLaporan(cacheDataServer);
        })
        .catch(err => {
          sembunyikanLoading();
        });
    }
  }

  setTanggalDefaultForm();
  updateStatusKoneksi();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        reg.onupdatefound = () => {
          const installingWorker = reg.installing;
          installingWorker.onstatechange = () => {
            if (installingWorker.state === 'installed') {
              if (navigator.serviceWorker.controller) {
                alert("Versi baru aplikasi tersedia! Halaman akan diperbarui otomatis.");
                window.location.reload();
              }
            }
          };
        };
      });
    });
  }
</script>
